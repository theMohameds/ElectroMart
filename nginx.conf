# Exercise 5: nginx load-balancer configuration
#
# nginx distributes requests across all running express-api containers.
# Docker's internal DNS for the "express-api" service name automatically
# resolves to every replica IP, so scaling is as simple as:
#
#   docker compose up --scale express-api=3
#
# nginx will round-robin across the three instances automatically.

upstream express_api_cluster {
    server express-api:3001;
}

server {
    listen 80;

    location / {
        proxy_pass         http://express_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors off;
    }
}
